<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PRADIP SHARE</title><link rel="stylesheet" href="style.css">
</head><body>
<header><div class="logo">P</div><div><h1>PRADIP SHARE</h1><small>Send files • Share simply</small></div></header>
<main>
<section class="panel"><label for="code">Your receive code</label><div class="code" id="myCode">------</div><button id="newCode" class="secondary">NEW CODE</button><p class="hint">अपना 6-digit code दूसरे फोन को दें।</p></section>
<nav><button id="sendTab" class="tab active">SEND</button><button id="receiveTab" class="tab">RECEIVE</button></nav>
<section id="sendPanel" class="panel"><h2>Send a file</h2>
<label for="recipient">Receiver's 6-digit code</label><input id="recipient" inputmode="numeric" maxlength="6" placeholder="482193">
<label for="file">Choose photo / video / file</label><input id="file" type="file">
<button id="sendBtn" class="primary">SEND FILE</button></section>
<section id="receivePanel" class="panel hidden"><h2>Received files</h2>
<button id="checkBtn" class="primary">CHECK FOR FILES</button><div id="incoming">No files received yet.</div></section>
<div id="status">Ready. Both phones need internet access to this server.</div>
<p class="foot">Demo version • Maximum file size: 25 MB</p>
</main><script src="app.js"></script></body></html>
